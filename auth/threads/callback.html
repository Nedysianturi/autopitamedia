<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="referrer" content="no-referrer">
  <title>Menghubungkan Threads ke Auto PitaMedia Studio...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0b0f19;
      color: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .box {
      text-align: center;
      padding: 36px 28px;
      background: #111827;
      border-radius: 14px;
      border: 1px solid #374151;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .spinner {
      border: 4px solid #1f2937;
      border-top: 4px solid #6366f1;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h2 {
      margin: 0 0 12px;
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
    }
    p {
      margin: 0 0 16px;
      font-size: 14px;
      line-height: 1.5;
      color: #9ca3af;
    }
    .target-box {
      font-family: monospace;
      font-size: 11px;
      color: #818cf8;
      background: #1f2937;
      padding: 10px;
      border-radius: 8px;
      word-break: break-all;
      margin-bottom: 20px;
      border: 1px solid #374151;
    }
    .btn {
      display: inline-block;
      background: #4f46e5;
      color: #ffffff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      padding: 9px 18px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #4338ca;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h2>Otorisasi Threads Diterima</h2>
    <p>Mengalihkan respon otorisasi kembali ke aplikasi Auto PitaMedia Studio di komputer Anda...</p>
    <div class="target-box" id="target">Menyiapkan pengalihan aman...</div>
    <a href="#" id="manualLink" class="btn">Klik di sini jika tidak teralihkan otomatis</a>
  </div>

  <script>
    (function() {
      // 1. Strict destination host & endpoint (Anti-Open-Redirect)
      const LOCAL_DESTINATION = 'http://127.0.0.1:3000/auth/threads/callback';
      
      // 2. Strict OAuth Parameter Whitelist
      const APPROVED_KEYS = ['code', 'state', 'error', 'error_reason', 'error_description'];
      
      const incoming = new URLSearchParams(window.location.search);
      const outgoing = new URLSearchParams();
      
      for (const key of APPROVED_KEYS) {
        if (incoming.has(key)) {
          outgoing.set(key, incoming.get(key));
        }
      }
      
      const queryString = outgoing.toString();
      const targetUrl = LOCAL_DESTINATION + (queryString ? '?' + queryString : '');
      
      // Display destination to operator
      const targetEl = document.getElementById('target');
      const manualLink = document.getElementById('manualLink');
      if (targetEl) targetEl.textContent = targetUrl;
      if (manualLink) manualLink.href = targetUrl;
      
      // Fast browser redirect using replace (prevents OAuth code retention in browser navigation history)
      setTimeout(function() {
        try {
          window.location.replace(targetUrl);
        } catch (e) {
          window.location.href = targetUrl;
        }
      }, 150);
    })();
  </script>
</body>
</html>
