<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Menghubungkan TikTok ke Auto PitaMedia Studio...</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0f19; color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .box { text-align: center; padding: 30px; background: #111827; border-radius: 12px; border: 1px solid #374151; max-width: 480px; }
    .spinner { border: 4px solid #1f2937; border-top: 4px solid #6366f1; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h2>Otorisasi TikTok Berhasil!</h2>
    <p>Mengalihkan kembali ke aplikasi Auto PitaMedia Studio di laptop Anda...</p>
    <p style="font-size: 13px; color: #9ca3af;" id="target"></p>
  </div>
  <script>
    const search = window.location.search;
    const targetUrl = 'http://localhost:3000/auth/tiktok/callback' + search;
    document.getElementById('target').innerText = targetUrl;
    setTimeout(() => {
      window.location.href = targetUrl;
    }, 500);
  </script>
</body>
</html>
